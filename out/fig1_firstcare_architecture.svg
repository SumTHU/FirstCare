<svg viewBox="0 0 1360 452" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrV" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ================= INPUT PANEL ================= -->
  <rect x="20" y="70" width="210" height="260" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Colloquial patient query q</text>
  <line x1="32" y1="98" x2="218" y2="98" stroke="#93c5fd" stroke-width="1"/>
  <rect x="32" y="110" width="186" height="58" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="125" y="128" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155">“My chest feels like</text>
  <text x="125" y="142" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155">a heavy stone is</text>
  <text x="125" y="156" text-anchor="middle" font-size="10.5" font-style="italic" fill="#334155">pressing down…”</text>
  <line x1="125" y1="168" x2="125" y2="177" stroke="#475569" stroke-width="1.3"/>
  <text x="125" y="184" text-anchor="middle" font-size="9" fill="#64748b">colloquial normalization</text>
  <text x="125" y="195" text-anchor="middle" font-size="9" fill="#64748b">(contrast line appended)</text>
  <line x1="125" y1="199" x2="125" y2="208" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="32" y="216" width="186" height="44" rx="22" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="125" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">normalized element:</text>
  <text x="125" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">chest pain</text>
  <text x="125" y="290" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">colloquial, ambiguous,</text>
  <text x="125" y="302" text-anchor="middle" font-size="9" font-style="italic" fill="#94a3b8">with daily-life noise</text>

  <!-- arrow input -> stage1 -->
  <line x1="230" y1="200" x2="269" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= STAGE 1 ================= -->
  <rect x="270" y="70" width="270" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="405" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">① Hybrid Retrieval + Jev Rerank</text>
  <line x1="284" y1="98" x2="526" y2="98" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="284" y="106" width="242" height="46" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="405" y="124" text-anchor="middle" font-size="11" fill="#0f172a">BM25 + TF-IDF (equal weight)</text>
  <text x="405" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">char 1/2/3-gram · doc view: title + HPI + Dx/DDx</text>
  <line x1="405" y1="152" x2="405" y2="167" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="318" y="168" width="174" height="26" rx="13" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="405" y="185" text-anchor="middle" font-size="11" fill="#0f172a">Top-50 candidates</text>
  <line x1="405" y1="194" x2="405" y2="207" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="318" y="208" width="174" height="26" rx="13" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="405" y="225" text-anchor="middle" font-size="11" fill="#0f172a">Jev pointwise rerank</text>
  <line x1="405" y1="234" x2="405" y2="247" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="318" y="248" width="174" height="26" rx="13" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="405" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Top-k  (k = 10)</text>
  <text x="405" y="302" text-anchor="middle" font-size="9.5" fill="#64748b">1,341 structured clinical</text>
  <text x="405" y="314" text-anchor="middle" font-size="9.5" fill="#64748b">cases from CMCR</text>

  <!-- arrow stage1 -> stage2 -->
  <line x1="540" y1="200" x2="579" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= STAGE 2 ================= -->
  <rect x="580" y="70" width="430" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">② Two-Question Fact Verification</text>
  <line x1="595" y1="98" x2="995" y2="98" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="595" y="104" width="400" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="795" y="123" text-anchor="middle" font-size="11" fill="#0f172a">Atomic propositions <tspan font-style="italic">f</tspan><tspan dy="2.5" font-size="8">1</tspan><tspan dy="-2.5">, …, </tspan><tspan font-style="italic">f</tspan><tspan dy="2.5" font-size="8">M</tspan><tspan dy="-2.5">  (query-agnostic · precomputed)</tspan></text>
  <line x1="692" y1="134" x2="692" y2="145" stroke="#475569" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="897" y1="134" x2="897" y2="145" stroke="#475569" stroke-width="1.1" marker-end="url(#arr)"/>
  <rect x="595" y="146" width="195" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/>
  <text x="692" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3730a3">Q1 · Mention check</text>
  <text x="692" y="173" text-anchor="middle" font-size="10" fill="#3730a3"><tspan font-style="italic">p</tspan><tspan dy="2" font-size="7.5">men</tspan><tspan dy="-2" dx="0.5">(</tspan><tspan font-style="italic">f</tspan><tspan dx="1.5">) — is it stated?</tspan></text>
  <rect x="800" y="146" width="195" height="34" rx="5" fill="#eef2ff" stroke="#6366f1"/>
  <text x="897" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3730a3">Q2 · Support check</text>
  <text x="897" y="173" text-anchor="middle" font-size="10" fill="#3730a3"><tspan font-style="italic">p</tspan><tspan dy="2" font-size="7.5">sup</tspan><tspan dy="-2" dx="0.5">(</tspan><tspan font-style="italic">f</tspan><tspan dx="1.5">) — affirmed?</tspan></text>
  <line x1="692" y1="180" x2="692" y2="207" stroke="#475569" stroke-width="1.1"/>
  <line x1="897" y1="180" x2="897" y2="207" stroke="#475569" stroke-width="1.1"/>
  <text x="795" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">threshold <tspan font-style="italic">τ</tspan><tspan dy="2.5" font-size="8" font-style="italic">f</tspan><tspan dy="-2.5"> = 0.7</tspan></text>
  <line x1="615" y1="210" x2="975" y2="210" stroke="#475569" stroke-width="1.2"/>
  <line x1="615" y1="210" x2="615" y2="220" stroke="#475569" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="795" y1="210" x2="795" y2="220" stroke="#475569" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="975" y1="210" x2="975" y2="220" stroke="#475569" stroke-width="1.1" marker-end="url(#arr)"/>
  <rect x="595" y="224" width="400" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text x="795" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">supported — patient-affirmed fact</text>
  <rect x="595" y="256" width="400" height="26" rx="13" fill="#fef3c7" stroke="#d97706"/>
  <text x="795" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">gap — mentioned but unconfirmed</text>
  <rect x="595" y="288" width="400" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="795" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">absent — not stated by the patient</text>

  <!-- arrow stage2 -> stage3 -->
  <line x1="1010" y1="200" x2="1059" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= STAGE 3 ================= -->
  <rect x="1060" y="70" width="280" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">③ Grounded Triage Generation</text>
  <line x1="1074" y1="98" x2="1326" y2="98" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1074" y="106" width="252" height="42" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1200" y="122" text-anchor="middle" font-size="10.5" fill="#0f172a">Hard gate: absent facts removed</text>
  <text x="1200" y="137" text-anchor="middle" font-size="9.5" fill="#64748b">before generation (no hallucinated symptoms)</text>
  <line x1="1200" y1="148" x2="1200" y2="159" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="1074" y="160" width="252" height="42" rx="5" fill="#ffffff" stroke="#f87171"/>
  <text x="1200" y="176" text-anchor="middle" font-size="10.5" fill="#0f172a">Red-flag escalation rule:</text>
  <text x="1200" y="191" text-anchor="middle" font-size="9.5" fill="#64748b">immediate emergency care</text>
  <line x1="1200" y1="202" x2="1200" y2="213" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="1074" y="214" width="252" height="54" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1200" y="229" text-anchor="middle" font-size="10.5" fill="#0f172a">Five-step structured output:</text>
  <text x="1200" y="243" text-anchor="middle" font-size="9.5" fill="#64748b">conclusion · misconception · mapping</text>
  <text x="1200" y="256" text-anchor="middle" font-size="9.5" fill="#64748b">boundaries · next steps</text>
  <rect x="1074" y="276" width="252" height="40" rx="20" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1200" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Triage recommendation +</text>
  <text x="1200" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">emergency warning</text>

  <!-- ================= INTERACTIVE LOOP ================= -->
  <polyline points="1200,330 1200,356 125,356 125,331" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrV)"/>
  <text x="660" y="349" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7c3aed">Interactive clarification — follow-up chips from gap / absent facts · accumulated statements re-run the full pipeline</text>

  <!-- ================= DATA FOUNDATION STRIP ================= -->
  <rect x="20" y="378" width="1320" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="680" y="405" text-anchor="middle" font-size="12.5" fill="#334155"><tspan font-weight="bold">Data pipeline (CMCR → CMCR-Colloquial):</tspan>  1,543 raw CMCR cases  →  1,341 structured cases  →  43,271 atomic propositions (23.0% red-flag)  →  1,339 colloquial QA pairs</text>

  <!-- ================= ICONS ================= -->
  <!-- input: speech bubble in query card -->
  <g transform="translate(196,117)" stroke="#60a5fa" fill="none" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0,1.5 h13 v8 h-8 l-4,3.5 v-3.5 h-1 z"/>
  </g>
  <!-- input: tag icon in normalized-element pill -->
  <g transform="translate(44,231)" stroke="#1d4ed8" fill="none" stroke-width="1.2" stroke-linejoin="round">
    <path d="M0.8,0.8 h5 l5.4,5.4 a1.7,1.7 0 0 1 0,2.4 l-3.6,3.6 a1.7,1.7 0 0 1 -2.4,0 L0.8,6.4 z"/>
    <circle cx="3.6" cy="3.6" r="0.9" fill="#1d4ed8" stroke="none"/>
  </g>
  <!-- stage1: magnifier in Top-50 pill -->
  <g transform="translate(325,176)" stroke="#64748b" fill="none" stroke-width="1.4" stroke-linecap="round">
    <circle cx="4" cy="4" r="3.5"/>
    <line x1="6.8" y1="6.8" x2="10" y2="10"/>
  </g>
  <!-- stage1: rank bars in Jev pill -->
  <g transform="translate(324,216)" stroke="#64748b" stroke-width="1.6" stroke-linecap="round">
    <line x1="0" y1="1" x2="10" y2="1"/>
    <line x1="0" y1="5" x2="7" y2="5"/>
    <line x1="0" y1="9" x2="4" y2="9"/>
  </g>
  <!-- stage2: proposition cylinder -->
  <g transform="translate(604,112)" stroke="#64748b" fill="none" stroke-width="1.2">
    <ellipse cx="6" cy="2.5" rx="6" ry="2.5"/>
    <path d="M0,2.5 v9 a6,2.5 0 0 0 12,0 v-9"/>
  </g>
  <!-- stage2: Q1 question mark -->
  <g transform="translate(607,153)" stroke="#4f46e5" fill="none" stroke-width="1.3" stroke-linecap="round">
    <circle cx="6" cy="6" r="5.5"/>
    <path d="M4.2,4.6 a1.9,1.9 0 1 1 2.6,1.8 c-0.6,0.25 -0.8,0.6 -0.8,1.2"/>
    <circle cx="6" cy="9.6" r="0.55" fill="#4f46e5" stroke="none"/>
  </g>
  <!-- stage2: Q2 check mark -->
  <g transform="translate(812,153)" stroke="#4f46e5" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="5.5"/>
    <path d="M3.4,6.2 l1.8,1.8 l3.4,-3.8"/>
  </g>
  <!-- stage3: shield-check (hard gate) -->
  <g transform="translate(1083,112)" stroke="#64748b" fill="none" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6,0 l5.5,2 v4.5 c0,3.5 -2.5,5.5 -5.5,6.5 c-3,-1 -5.5,-3 -5.5,-6.5 V2 z"/>
    <line x1="3.5" y1="6.5" x2="5.3" y2="8.3"/>
    <line x1="5.3" y1="8.3" x2="8.8" y2="4.6"/>
  </g>
  <!-- stage3: warning triangle (red flag) -->
  <g transform="translate(1085,172)" stroke="#dc2626" fill="none" stroke-width="1.3" stroke-linejoin="round">
    <path d="M6.5,0.8 L12.7,11.5 H0.3 z"/>
    <line x1="6.5" y1="4.6" x2="6.5" y2="7.6"/>
    <circle cx="6.5" cy="9.6" r="0.55" fill="#dc2626" stroke="none"/>
  </g>
  <!-- stage3: document (five-step output) -->
  <g transform="translate(1086,222)" stroke="#64748b" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1,0 h7 l4,4 v9 h-11 z"/>
    <path d="M8,0 v4 h4"/>
    <line x1="3.5" y1="7" x2="9.5" y2="7"/>
    <line x1="3.5" y1="10" x2="9.5" y2="10"/>
  </g>
  <!-- stage3: medical cross (triage recommendation) -->
  <g transform="translate(1092,289)" stroke="#16a34a" fill="none" stroke-width="1.4" stroke-linecap="round">
    <circle cx="6.5" cy="6.5" r="6"/>
    <line x1="6.5" y1="3.5" x2="6.5" y2="9.5"/>
    <line x1="3.5" y1="6.5" x2="9.5" y2="6.5"/>
  </g>
  <!-- loop: refresh cycle -->
  <g transform="translate(324,339)">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="25 6.3" stroke-dashoffset="-2" transform="rotate(40 6 6)"/>
    <path d="M10.8,2.2 l3.4,-1 l-1,3.4 z" fill="#7c3aed"/>
  </g>
  <!-- data strip: database cylinders at both ends -->
  <g transform="translate(44,391)" stroke="#64748b" fill="none" stroke-width="1.2">
    <ellipse cx="7" cy="3" rx="7" ry="3"/>
    <path d="M0,3 v13 a7,3 0 0 0 14,0 V3"/>
    <path d="M0,9.5 a7,3 0 0 0 14,0"/>
  </g>
  <g transform="translate(1302,391)" stroke="#64748b" fill="none" stroke-width="1.2">
    <ellipse cx="7" cy="3" rx="7" ry="3"/>
    <path d="M0,3 v13 a7,3 0 0 0 14,0 V3"/>
    <path d="M0,9.5 a7,3 0 0 0 14,0"/>
  </g>
</svg>
