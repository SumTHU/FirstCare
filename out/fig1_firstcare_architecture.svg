<svg viewBox="0 0 1360 590" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrV" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ================= INPUT PANEL ================= -->
  <rect x="20" y="20" width="240" height="440" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <g transform="translate(36,34) scale(1.8)" stroke="#1d4ed8" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0,1.5 h13 v8 h-8 l-4,3.5 v-3.5 h-1 z"/>
  </g>
  <text x="148" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e3a8a">Input query</text>
  <line x1="34" y1="62" x2="246" y2="62" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="34" y="124" width="212" height="96" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="140" y="152" text-anchor="middle" font-size="22" font-style="italic" fill="#334155">“My chest feels</text>
  <text x="140" y="180" text-anchor="middle" font-size="22" font-style="italic" fill="#334155">like a heavy stone</text>
  <text x="140" y="208" text-anchor="middle" font-size="22" font-style="italic" fill="#334155">is pressing down…”</text>
  <line x1="140" y1="226" x2="140" y2="240" stroke="#475569" stroke-width="2"/>
  <text x="140" y="262" text-anchor="middle" font-size="22" fill="#475569">normalization</text>
  <line x1="140" y1="268" x2="140" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="34" y="296" width="212" height="64" rx="32" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="322" text-anchor="middle" font-size="22" fill="#1e40af">normalized element</text>
  <text x="140" y="350" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e40af">chest pain</text>

  <!-- arrow input -> stage1 -->
  <line x1="260" y1="240" x2="290" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= STAGE 1 ================= -->
  <rect x="296" y="20" width="272" height="440" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <g transform="translate(312,36) scale(1.8)" stroke="#475569" fill="none" stroke-width="1.4" stroke-linecap="round">
    <circle cx="4" cy="4" r="3.5"/>
    <line x1="6.8" y1="6.8" x2="10" y2="10"/>
  </g>
  <text x="448" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">① Retrieval</text>
  <line x1="310" y1="62" x2="554" y2="62" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="310" y="74" width="244" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="432" y="104" text-anchor="middle" font-size="24" fill="#0f172a">BM25 + TF-IDF</text>
  <text x="432" y="130" text-anchor="middle" font-size="22" fill="#475569">char 1/2/3-gram</text>
  <text x="432" y="154" text-anchor="middle" font-size="22" fill="#475569">title + HPI + Dx/DDx</text>
  <line x1="432" y1="164" x2="432" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="322" y="186" width="220" height="34" rx="17" fill="#e2e8f0" stroke="#64748b"/>
  <text x="432" y="210" text-anchor="middle" font-size="22" fill="#0f172a">Top-50 candidates</text>
  <line x1="432" y1="224" x2="432" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="322" y="246" width="220" height="34" rx="17" fill="#e2e8f0" stroke="#64748b"/>
  <text x="432" y="270" text-anchor="middle" font-size="22" fill="#0f172a">Jev pointwise rerank</text>
  <line x1="432" y1="284" x2="432" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="322" y="306" width="220" height="34" rx="17" fill="#e2e8f0" stroke="#64748b"/>
  <text x="432" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Top-k  (k = 10)</text>
  <text x="432" y="378" text-anchor="middle" font-size="22" fill="#475569">1,341 CMCR cases</text>

  <!-- arrow stage1 -> stage2 -->
  <line x1="568" y1="240" x2="598" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= STAGE 2 ================= -->
  <rect x="604" y="20" width="400" height="440" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <g transform="translate(622,36) scale(1.8)" stroke="#4f46e5" fill="none" stroke-width="1.3" stroke-linecap="round">
    <circle cx="6" cy="6" r="5.5"/>
    <path d="M4.2,4.6 a1.9,1.9 0 1 1 2.6,1.8 c-0.6,0.25 -0.8,0.6 -0.8,1.2"/>
    <circle cx="6" cy="9.6" r="0.55" fill="#4f46e5" stroke="none"/>
  </g>
  <text x="822" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">② Fact Verification</text>
  <line x1="618" y1="62" x2="990" y2="62" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="618" y="74" width="372" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="804" y="104" text-anchor="middle" font-size="24" fill="#0f172a">Atomic propositions <tspan font-style="italic">f</tspan><tspan dy="6" font-size="15">1</tspan><tspan dy="-6">, …, </tspan><tspan font-style="italic">f</tspan><tspan dy="6" font-size="15">M</tspan></text>
  <text x="804" y="130" text-anchor="middle" font-size="22" fill="#475569">(query-agnostic · precomputed)</text>
  <line x1="705" y1="140" x2="705" y2="154" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="899" y1="140" x2="899" y2="154" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="618" y="158" width="176" height="58" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="706" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#3730a3">Q1 · Mention</text>
  <text x="706" y="206" text-anchor="middle" font-size="22" fill="#3730a3"><tspan font-style="italic">p</tspan><tspan dy="5" font-size="14">men</tspan><tspan dy="-5" dx="1">(</tspan><tspan font-style="italic">f</tspan><tspan dx="2">)</tspan></text>
  <rect x="810" y="158" width="176" height="58" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="898" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#3730a3">Q2 · Support</text>
  <text x="898" y="206" text-anchor="middle" font-size="22" fill="#3730a3"><tspan font-style="italic">p</tspan><tspan dy="5" font-size="14">sup</tspan><tspan dy="-5" dx="1">(</tspan><tspan font-style="italic">f</tspan><tspan dx="2">)</tspan></text>
  <line x1="705" y1="216" x2="705" y2="264" stroke="#475569" stroke-width="1.8"/>
  <line x1="899" y1="216" x2="899" y2="264" stroke="#475569" stroke-width="1.8"/>
  <text x="804" y="240" text-anchor="middle" font-size="22" fill="#475569">threshold</text>
  <text x="804" y="262" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a"><tspan font-style="italic">τ</tspan><tspan dy="5" font-size="15" font-style="italic">f</tspan><tspan dy="-5"> = 0.7</tspan></text>
  <line x1="648" y1="272" x2="960" y2="272" stroke="#475569" stroke-width="1.8"/>
  <line x1="648" y1="272" x2="648" y2="286" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="804" y1="272" x2="804" y2="286" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="960" y1="272" x2="960" y2="286" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="618" y="290" width="372" height="34" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="804" y="314" text-anchor="middle" font-size="22" font-weight="bold" fill="#14532d">supported — patient-affirmed</text>
  <rect x="618" y="336" width="372" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="804" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#78350f">gap — mentioned, unconfirmed</text>
  <rect x="618" y="382" width="372" height="34" rx="17" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="804" y="406" text-anchor="middle" font-size="22" font-weight="bold" fill="#7f1d1d">absent — not stated</text>

  <!-- arrow stage2 -> stage3 -->
  <line x1="1004" y1="240" x2="1034" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= STAGE 3 ================= -->
  <rect x="1040" y="20" width="300" height="440" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <g transform="translate(1058,36) scale(1.8)" stroke="#475569" fill="none" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6,0 l5.5,2 v4.5 c0,3.5 -2.5,5.5 -5.5,6.5 c-3,-1 -5.5,-3 -5.5,-6.5 V2 z"/>
    <line x1="3.5" y1="6.5" x2="5.3" y2="8.3"/>
    <line x1="5.3" y1="8.3" x2="8.8" y2="4.6"/>
  </g>
  <text x="1212" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">③ Generation</text>
  <line x1="1054" y1="62" x2="1326" y2="62" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1054" y="74" width="272" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1190" y="100" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Hard gate</text>
  <text x="1190" y="126" text-anchor="middle" font-size="22" fill="#475569">absent facts removed</text>
  <line x1="1190" y1="142" x2="1190" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1054" y="162" width="272" height="64" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="1190" y="188" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Red-flag escalation</text>
  <text x="1190" y="212" text-anchor="middle" font-size="22" fill="#475569">immediate emergency care</text>
  <line x1="1190" y1="230" x2="1190" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1054" y="250" width="272" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1190" y="276" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Five-step output</text>
  <text x="1190" y="298" text-anchor="middle" font-size="22" fill="#475569">grounded in top-k cases</text>
  <line x1="1190" y1="310" x2="1190" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1054" y="330" width="272" height="62" rx="31" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1190" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#14532d">Triage recommendation</text>
  <text x="1190" y="382" text-anchor="middle" font-size="22" font-weight="bold" fill="#14532d">+ emergency warning</text>

  <!-- ================= INTERACTIVE LOOP ================= -->
  <polyline points="1190,460 1190,492 140,492 140,466" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrV)"/>
  <text x="665" y="484" text-anchor="middle" font-size="22" font-style="italic" fill="#7c3aed">Interactive clarification — follow-up chips · accumulated statements re-run the pipeline</text>
  <g transform="translate(156,474) scale(1.8)">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="25 6.3" stroke-dashoffset="-2" transform="rotate(40 6 6)"/>
    <path d="M10.8,2.2 l3.4,-1 l-1,3.4 z" fill="#7c3aed"/>
  </g>

  <!-- ================= DATA STRIP ================= -->
  <rect x="20" y="512" width="1320" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="547" text-anchor="middle" font-size="22" fill="#334155"><tspan font-weight="bold">Data pipeline:</tspan>  1,543 raw cases  →  1,341 structured  →  43,271 propositions (23.0% red-flag)  →  1,339 QA pairs</text>
  <g transform="translate(44,528) scale(1.8)" stroke="#475569" fill="none" stroke-width="1.2">
    <ellipse cx="7" cy="3" rx="7" ry="3"/>
    <path d="M0,3 v13 a7,3 0 0 0 14,0 V3"/>
    <path d="M0,9.5 a7,3 0 0 0 14,0"/>
  </g>
  <g transform="translate(1300,528) scale(1.8)" stroke="#475569" fill="none" stroke-width="1.2">
    <ellipse cx="7" cy="3" rx="7" ry="3"/>
    <path d="M0,3 v13 a7,3 0 0 0 14,0 V3"/>
    <path d="M0,9.5 a7,3 0 0 0 14,0"/>
  </g>
</svg>
